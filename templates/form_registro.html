{% extends "base.html" %} {% block content %}
<div class="container mt-4">
  <h2>Registrar Nova Doação</h2>
  <hr />

  {% with messages = get_flashed_messages(with_categories=true) %} {% if
  messages %} {% for category, message in messages %}
  <div
    class="alert alert-{{ 'danger' if category == 'erro' else 'success' }} alert-dismissible fade show"
    role="alert"
  >
    {{ message }}
  </div>
  {% endfor %} {% endif %} {% endwith %}

  <form method="POST" class="mt-3">
    <!-- Seleção da Família -->
    <div class="mb-3">
      <label for="familia_id" class="form-label">Família Beneficiada</label>
      <select name="familia_id" id="familia_id" class="form-control" required>
        <option value="">Selecione uma família...</option>
        {% for familia in familias %}
        <option value="{{ familia.id }}">
          {{ familia.nome }} (CPF: {{ familia.cpf }})
        </option>
        {% endfor %}
      </select>
    </div>

    <!-- Seleção do Item do Estoque -->
    <div class="mb-3">
      <label for="item_id" class="form-label">Item do Estoque</label>
      <select name="item_id" id="item_id" class="form-control" required>
        <option value="">Selecione um item...</option>
        {% for item in itens %}
        <option value="{{ item.id }}">
          {{ item.nome }} (Disponíveis: {{ item.quantidade }})
        </option>
        {% endfor %}
      </select>
    </div>

    <!-- Quantidade -->
    <div class="mb-3">
      <label for="quantidade" class="form-label">Quantidade</label>
      <input
        type="number"
        class="form-control"
        id="quantidade"
        name="quantidade"
        min="1"
        required
        placeholder="Ex: 2"
      />
    </div>

    <button type="submit" class="btn btn-primary">Salvar Doação</button>
    <a href="{{ url_for('index') }}" class="btn btn-secondary">Cancelar</a>
  </form>
</div>
{% endblock %}
