{% extends "base.html" %} {% block content %}
<div
  class="bg-white p-6 rounded-lg shadow border border-slate-200 max-w-xl mx-auto"
>
  <h2 class="text-2xl font-bold text-blue-900 mb-4">Registro de Doação</h2>
  {% with messages = get_flashed_messages(with_categories=true) %} {% if
  messages %} {% for category, message in messages %}
  <div
    class="bg-red-100 border-l-4 border-red-500 text-red-700 p-4 mb-4 rounded"
    role="alert"
  >
    <p>{{ message }}</p>
  </div>
  {% endfor %} {% endif %} {% endwith %}
  <form method="POST" class="space-y-4">
    <div>
      <label
        for="familia_id"
        class="block text-sm font-medium text-slate-700 mb-1"
        >Família Beneficiária:</label
      >
      <select
        name="familia_id"
        id="familia_id"
        required
        class="w-full p-3 border border-slate-300 rounded-lg focus:ring-2 focus:ring-blue-500"
      >
        {% for f in familias %}
        <option value="{{ f.id }}">{{ f.nome }} (CPF: {{ f.cpf }})</option>
        {% endfor %}
      </select>
    </div>
    <div>
      <label for="item_id" class="block text-sm font-medium text-slate-700 mb-1"
        >Item do Estoque:</label
      >
      <select
        name="item_id"
        id="item_id"
        required
        class="w-full p-3 border border-slate-300 rounded-lg focus:ring-2 focus:ring-blue-500"
      >
        {% for i in itens %}
        <option value="{{ i.id }}">
          {{ i.nome }} (Disponível: {{ i.quantidade }})
        </option>
        {% endfor %}
      </select>
    </div>
    <div>
      <label
        for="quantidade"
        class="block text-sm font-medium text-slate-700 mb-1"
        >Quantidade Entregue:</label
      >
      <input
        type="number"
        name="quantidade"
        id="quantidade"
        min="1"
        value="1"
        required
        class="w-full p-3 border border-slate-300 rounded-lg focus:ring-2 focus:ring-blue-500"
      />
    </div>
    <div class="flex gap-4 pt-2">
      <button
        type="submit"
        class="flex-1 bg-emerald-600 hover:bg-emerald-700 text-white font-semibold py-3 px-4 rounded-lg shadow text-center focus:ring-4 focus:ring-emerald-300"
      >
        Confirmar Entrega
      </button>
      <a
        href="{{ url_for('index') }}"
        class="px-4 py-3 bg-slate-200 hover:bg-slate-300 text-slate-700 font-semibold rounded-lg text-center"
      >
        Cancelar
      </a>
    </div>
  </form>
</div>
{% endblock %}
