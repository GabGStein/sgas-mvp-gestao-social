{% extends "base.html" %} {% block content %}
<div class="space-y-6">
  <div class="bg-white p-6 rounded-lg shadow border border-slate-200">
    <h2 class="text-2xl font-bold text-blue-900 mb-2">Painel Operacional</h2>
    <p class="text-slate-600 mb-4">
      Bem-vindo ao sistema de controle de doações e atendimento comunitário.
    </p>
    <a
      href="{{ url_for('registrar_doacao') }}"
      class="inline-block w-full sm:w-auto bg-blue-600 hover:bg-blue-700 text-white font-semibold px-6 py-3 rounded-lg shadow text-center focus:outline-none focus:ring-4 focus:ring-blue-300"
    >
      📦 Registrar Nova Doação
    </a>
  </div>
  <div class="bg-white p-6 rounded-lg shadow border border-slate-200">
    <h3 class="text-lg font-bold text-slate-800 mb-3">Estoque Atual</h3>
    <ul class="divide-y divide-slate-100">
      {% for item in estoque %}
      <li class="py-2 flex justify-between items-center">
        <span class="font-medium">{{ item.nome }}</span>
        <span
          class="bg-blue-100 text-blue-800 text-sm font-semibold px-3 py-1 rounded-full"
          >{{ item.quantidade }} unidades</span
        >
      </li>
      {% endfor %}
    </ul>
  </div>
</div>
{% endblock %}
