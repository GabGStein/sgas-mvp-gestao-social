<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SGAS - Sistema de Gestão e Apoio Social</title>
    <script src="https://cdn.tailwindcss.com"></script>
  </head>
  <body class="bg-slate-50 text-slate-900 font-sans min-h-screen flex flex-col">
    <header class="bg-blue-800 text-white p-4 shadow-md">
      <div class="max-w-4xl mx-auto flex justify-between items-center">
        <h1 class="text-xl font-bold">SGAS — Gestão Social</h1>
        <a
          href="/"
          class="text-sm underline hover:text-blue-200 focus:ring-2 focus:ring-white p-1"
          >Início</a
        >
      </div>
    </header>
    <main class="flex-grow max-w-4xl w-full mx-auto p-4 sm:p-6">
      {% block content %}{% endblock %}
    </main>
    <footer class="bg-slate-800 text-slate-300 text-center p-4 text-sm">
      MVP SGAS — Validação de Campo e Inclusão Social
    </footer>
  </body>
</html>
